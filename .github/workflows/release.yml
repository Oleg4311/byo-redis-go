name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - name: Сборка под все платформы
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            name="byo-redis-go-${GITHUB_REF_NAME}-${os}-${arch}"
            mkdir "dist/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w" \
              -o "dist/$name/byo-redis$ext" ./cmd/byo-redis
            cp README.md LICENSE "dist/$name/"
            if [ "$os" = windows ]; then (cd dist && zip -qr "$name.zip" "$name"); else tar -C dist -czf "dist/$name.tar.gz" "$name"; fi
          done
          (cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS)
      - name: Подтверждение происхождения (provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.tar.gz dist/SHA256SUMS
          --title "byo-redis-go $GITHUB_REF_NAME"
          --notes "Redis-совместимый сервер на Go одним бинарником. Проверьте SHA-256 из SHA256SUMS. Запуск: byo-redis --addr 127.0.0.1:6379 --aof data.aof. Подробнее в README."
